[project]
name = "catnip"
version = "0.1.0"
description = "A terminal-based, Textual-powered file browser and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "textual[syntax]>=7.5.0,<8",
    "rich>=14.3.4,<15",
    "pygments>=2.21.0,<3",
    "psutil>=7.2.2,<8",
]

[dependency-groups]
dev = [
    "black>=25.12.0,<26",
]
